name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for git-cliff to read history

      - name: Generate Latest Release Notes with git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release_notes.md

      - name: Prepend Latest Release to CHANGELOG.md
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --latest --prepend CHANGELOG.md

      - name: Commit CHANGELOG.md Update
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          branch: main
          commit_message: "🤖 chore(release): update CHANGELOG.md for ${{ github.ref_name }} [skip ci]"
          files: CHANGELOG.md
          fail_on_self_push: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md

      - name: Update Floating Major Version Tag (e.g., v1)
        run: |
          MAJOR_VERSION=$(echo "${{ github.ref_name }}" | cut -d. -f1)
          
          git fetch origin main
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -fa "$MAJOR_VERSION" origin/main -m "Update $MAJOR_VERSION tag to ${{ github.ref_name }}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$MAJOR_VERSION" --force