name: 'SSH Asset Signer'
description: 'Cryptographically sign release assets and build artifacts using OpenSSH keys.'
author: 'Infiniti151'

branding:
  icon: 'lock'
  color: 'purple'

inputs:
  private-key:
    description: 'SSH private key string or path to private key file.'
    required: true
  files:
    description: 'Space-separated list of file paths or globs to sign.'
    required: true
  passphrase:
    description: 'Passphrase for the encrypted SSH private key.'
    required: false
    default: ''
  namespace:
    description: 'OpenSSH signature namespace tag.'
    required: false
    default: 'file'
  principal:
    description: 'Principal identity claim. Required if generate-allowed-signers is true.'
    required: false
    default: ''
  generate-allowed-signers:
    description: 'Whether to generate an allowed_signers file for downstream verification.'
    required: false
    default: false
  sig-dir:
    description: 'Directory path where generated .sig files will be placed.'
    required: false
    default: ''
  allowed-signers-dir:
    description: 'Directory path where the allowed_signers file will be created.'
    required: false
    default: ''

outputs:
  signed-files:
    description: 'Space-separated list of files that were signed.'
    value: ${{ steps.sign_step.outputs.signed-files }}
  sig-files:
    description: 'Space-separated list of generated signature (.sig) file paths.'
    value: ${{ steps.sign_step.outputs.sig-files }}
  allowed-signers-path:
    description: 'Path to the generated allowed_signers file (if enabled).'
    value: ${{ steps.sign_step.outputs.allowed-signers-path }}
  public-key:
    description: 'The extracted SSH public key corresponding to the private signing key.'
    value: ${{ steps.sign_step.outputs.public-key }}

runs:
  using: 'composite'
  steps:
    - id: sign_step
      shell: bash
      env:
        INPUT_PRIVATE_KEY: ${{ inputs.private-key }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_PASSPHRASE: ${{ inputs.passphrase }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_PRINCIPAL: ${{ inputs.principal }}
        INPUT_GENERATE_ALLOWED_SIGNERS: ${{ inputs.generate-allowed-signers }}
        INPUT_SIG_DIR: ${{ inputs.sig-dir }}
        INPUT_ALLOWED_SIGNERS_DIR: ${{ inputs.allowed-signers-dir }}
      run: ${{ github.action_path }}/sign.sh